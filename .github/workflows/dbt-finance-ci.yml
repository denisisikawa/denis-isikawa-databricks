name: dbt Finance Lab CI
on:
  push:
    branches: [main]
    paths:
      - 'dbt-finance-lab/**'
      - '.github/workflows/dbt-finance-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dbt-finance-lab/**'
      - '.github/workflows/dbt-finance-ci.yml'
jobs:
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt-finance-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dbt adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dbt.txt
      - name: Prepare local profile
        run: cp profiles.example.yml profiles.yml
      - name: Build and test
        run: |
          dbt debug --profiles-dir .
          dbt build --profiles-dir .
